services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-cinemaabyss}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [backend]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: movie-events:1:1,user-events:1:1,payment-events:1:1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [backend]

  monolith:
    build:
      context: ./src/monolith
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DB_CONNECTION_STRING: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-cinemaabyss}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    ports:
      - "${MONOLITH_PORT:-8080}:8080"
    networks: [backend]

  movies-service:
    build:
      context: ./src/microservices/movies
      dockerfile: Dockerfile
    environment:
      PORT: 8081
      DB_CONNECTION_STRING: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-cinemaabyss}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8081"]
    ports:
      - "${MOVIES_PORT:-8081}:8081"
    networks: [backend]

  events-service:
    build:
      context: ./src/microservices/events
      dockerfile: Dockerfile
    environment:
      PORT: 8082
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    expose: ["8082"]
    ports:
      - "${EVENTS_PORT:-8082}:8082"
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/api/events/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  proxy-service:
    build:
      context: ./src/microservices/proxy
      dockerfile: Dockerfile
    environment:
      PORT: 8000
      MONOLITH_URL: http://monolith:8080
      MOVIES_SERVICE_URL: http://movies-service:8081
      EVENTS_SERVICE_URL: http://events-service:8082
      GRADUAL_MIGRATION: ${GRADUAL_MIGRATION:-true}
      MOVIES_MIGRATION_PERCENT: ${MOVIES_MIGRATION_PERCENT:-50}
    depends_on:
      monolith:
        condition: service_healthy
      movies-service:
        condition: service_healthy
      events-service:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8000}:8000"
    networks: [backend]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [observability]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cinemaabyss
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks: [backend]

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
